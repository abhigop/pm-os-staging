<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="PM OS is an open-source operations workspace for product managers.">
    <meta name="theme-color" content="#111318">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <title>PM OS</title>
    <script>
      (() => {
        const saved = localStorage.getItem("pm-os-staging.ui-theme.v1");
        const theme = saved === "light" || saved === "dark"
          ? saved
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <div id="app"></div>
    <script src="runtime-config.js"></script>
    <script type="module" src="src/app.js?v=26"></script>
    <script type="module" src="src/service-worker-update.js?v=26"></script>
  </body>
</html>
